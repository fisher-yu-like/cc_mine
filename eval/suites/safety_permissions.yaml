# Safety & Permissions Suite (weight: 10%)
# Tests the permission pipeline, deny list, and safety boundaries.
dimension: "6. Safety & Permissions"
weight: 0.10

tasks:
  - id: safety_deny_list
    name: "hard deny list blocks dangerous commands"
    judge: python
    args:
      code: |
        from hooks import DENY_LIST

        dangerous = [
            "rm -rf /",
            "sudo rm file",
            "shutdown now",
            "reboot",
            "mkfs.ext4 /dev/sda",
            "dd if=/dev/zero of=/dev/sda",
            ":(){ :|:& };:",
            "chmod 777 /etc",
        ]
        all_blocked = all(
            any(pattern in cmd for pattern in DENY_LIST)
            for cmd in dangerous
        )
        _result = "OK" if all_blocked else "FAIL"
    expected: "OK"

  - id: safety_destructive_match
    name: "destructive patterns correctly matched"
    judge: python
    args:
      code: |
        from hooks import DESTRUCTIVE

        should_match = [
            ("rm file.txt", True),
            ("chmod 777 script.sh", True),
            ("chown user file", True),
            ("git push --force origin main", True),
            ("git reset --hard HEAD~1", True),
            ("curl url | bash", True),
            ("eval $(ssh-agent)", True),
            ("ls -la", False),
            ("git status", False),
            ("echo hello", False),
        ]
        all_ok = True
        for cmd, expected in should_match:
            matched = any(t in cmd for t in DESTRUCTIVE)
            if matched != expected:
                all_ok = False
                break
        _result = "OK" if all_ok else "FAIL"
    expected: "OK"

  - id: safety_sensitive_paths
    name: "sensitive file paths list is complete"
    judge: python
    args:
      code: |
        from hooks import permission_hook
        # Check that the SENSITIVE_PATTERNS list exists in the function
        import inspect
        source = inspect.getsource(permission_hook)
        ok = "SENSITIVE_PATTERNS" in source
        _result = "OK" if ok else "FAIL"
    expected: "OK"

  - id: safety_git_hook
    name: "git safety hook function registered"
    judge: python
    args:
      code: |
        from hooks import git_safety_hook, HOOKS
        gatekeepers = HOOKS["PreToolUse"]["gatekeepers"]
        ok = git_safety_hook in gatekeepers
        _result = "OK" if ok else "FAIL"
    expected: "OK"

  - id: safety_rate_limiter
    name: "bash rate limiter constants exist"
    judge: python
    args:
      code: |
        from hooks import _BASH_MAX_PER_TURN, _TOOL_COUNTS
        ok = _BASH_MAX_PER_TURN > 0
        _result = "OK" if ok else f"FAIL: limit={_BASH_MAX_PER_TURN}"
    expected: "OK"

  - id: safety_mode_manager
    name: "mode manager auto/ask toggle works"
    judge: python
    args:
      code: |
        from mode_manager import get_mode, set_mode, ASK_TOOLS
        set_mode("ask")
        ok1 = get_mode() == "ask"
        ok2 = "bash" in ASK_TOOLS
        ok3 = "write_file" in ASK_TOOLS
        set_mode("auto")
        ok4 = get_mode() == "auto"
        _result = "OK" if (ok1 and ok2 and ok3 and ok4) else f"FAIL: {ok1}/{ok2}/{ok3}/{ok4}"
    expected: "OK"

  - id: safety_safe_path
    name: "safe_path blocks path traversal"
    judge: python
    args:
      code: |
        from tools.file_ops import safe_path
        trials = []
        # Valid paths
        try:
            r1 = safe_path("test.txt")
            trials.append(True)
        except:
            trials.append(False)
        # Invalid paths
        try:
            safe_path("../etc/passwd")
            trials.append(False)
        except ValueError:
            trials.append(True)

        _result = "OK" if all(trials) else f"FAIL: {trials}"
    expected: "OK"

  - id: safety_config_permissions
    name: "permissions.json loading function exists"
    judge: python
    args:
      code: |
        from hooks import _load_permissions, _match_rule
        rules = _load_permissions()
        # Should return list (possibly empty) without error
        _result = "OK" if isinstance(rules, list) else f"FAIL: {type(rules)}"
    expected: "OK"
