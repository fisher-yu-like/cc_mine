# Context & Memory Suite (weight: 10%)
# Tests memory CRUD, context compaction, and skill persistence.
dimension: "5. Context & Memory"
weight: 0.10

tasks:
  - id: mem_add_user
    name: "add user memory persists to user/ subdir"
    judge: python
    args:
      code: |
        from memory import add_memory, delete_memory
        from config import USER_MEMORY_DIR

        # Clean up leftovers from previous runs
        for p in USER_MEMORY_DIR.glob("user_pref_test*.md"):
            p.unlink()
        import uuid
        unique = f"prefers tabs {uuid.uuid4().hex[:8]}"

        r = add_memory("user_pref_test", unique, source="user")
        ok1 = "user_pref_test" in r.lower() or "save" in r.lower()

        files = list(USER_MEMORY_DIR.glob("*.md"))
        ok2 = any("user_pref_test" in f.name for f in files)

        delete_memory("user_pref_test")
        _result = "OK" if (ok1 and ok2) else f"FAIL: ok1={ok1} ok2={ok2} files={[f.name for f in files]}"
    expected: "OK"

  - id: mem_add_agent
    name: "add agent memory goes to agent/ subdir"
    judge: python
    args:
      code: |
        from memory import add_memory, delete_memory
        from config import AGENT_MEMORY_DIR

        # Clean up leftovers
        for p in AGENT_MEMORY_DIR.glob("agent_note_test*.md"):
            p.unlink()
        import uuid
        unique = f"fixed bug {uuid.uuid4().hex[:8]}"

        r = add_memory("agent_note_test", unique, source="agent")
        files = list(AGENT_MEMORY_DIR.glob("*.md"))
        ok = any("agent_note_test" in f.name for f in files)
