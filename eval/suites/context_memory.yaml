  - id: mem_dedup
    name: "duplicate memory detection works"
    judge: python
    args:
      code: |
        from memory import add_memory, delete_memory
        from config import AGENT_MEMORY_DIR

        # Clean up leftovers
        for p in AGENT_MEMORY_DIR.glob("dedup_test*.md"):
            p.unlink()
        import uuid
        unique = f"dedup content {uuid.uuid4().hex}"

        # First add
        add_memory("dedup_test", unique, source="agent")
        # Second add with SAME content — should be skipped by dedup
        r2 = add_memory("dedup_test", unique, source="agent")
        ok = "skip" in r2.lower() or "similar" in r2.lower() or "already" in r2.lower()
        delete_memory("dedup_test")
        _result = "OK" if ok else f"FAIL: {r2}"
    expected: "OK"

  - id: mem_context_update
    name: "update_context collects memories from subdirs"
    judge: python
    args:
      code: |
        from memory import update_context, add_memory, delete_memory
        from config import USER_MEMORY_DIR

        for p in USER_MEMORY_DIR.glob("ctx_test_pref*.md"):
            p.unlink()
        import uuid
        add_memory("ctx_test_pref", f"always use pytest {uuid.uuid4().hex[:8]}", source="user")
        ctx = update_context({}, [])
        ok1 = ctx.get("memories") and len(ctx["memories"]) > 0
        ok2 = "User" in ctx["memories"] or "pytest" in ctx["memories"]
        delete_memory("ctx_test_pref")
        mem_len = len(ctx.get("memories", ""))
        _result = "OK" if (ok1 and ok2) else "FAIL: mem_len=" + str(mem_len)
    expected: "OK"

  - id: mem_search
    name: "search_memory finds content across subdirs"
    judge: python
    args:
      code: |
        from memory import add_memory, search_memory, delete_memory
        from config import AGENT_MEMORY_DIR

        for p in AGENT_MEMORY_DIR.glob("search_test_xyz*.md"):
            p.unlink()
        import uuid
        unique = f"benchmark searchable {uuid.uuid4().hex[:8]}"
        add_memory("search_test_xyz", unique, source="agent")
        r = search_memory(unique[:20])
        ok = len(r) > 20
        delete_memory("search_test_xyz")
        _result = "OK" if ok else "FAIL: " + r[:100]
    expected: "OK"

  - id: mem_skill_context
    name: "skill context survives compaction simulation"
    judge: python
    args:
      code: |
        from skill_context import store_skill_content, get_loaded_skills_context, is_skill_loaded, clear_skills
        store_skill_content("test-skill", "# Test Skill\nInstructions for testing.\n" * 20)
        ctx = get_loaded_skills_context()
        ok1 = "test-skill" in ctx and is_skill_loaded("test-skill")
        ok2 = len(ctx) <= 2000  # capped at 1500 per skill
        clear_skills()
        ok3 = not is_skill_loaded("test-skill")
        _result = "OK" if (ok1 and ok2 and ok3) else f"FAIL: ok1={ok1} ok2={ok2} ok3={ok3} len={len(ctx)}"
    expected: "OK"

  - id: mem_orphan_clean
    name: "orphan tool messages stripped correctly"
    judge: python
    args:
      code: |
        from memory import _strip_orphan_tools
        msgs = [
            {"role": "assistant", "tool_calls": [{"id": "orphan_call", "function": {"name": "bash"}}]},
            {"role": "tool", "tool_call_id": "valid_id"},
        ]
        cleaned = _strip_orphan_tools(msgs)
        # Orphaned assistant tool_call (no response) should be stripped
        # Orphaned tool msg (no corresponding call) should be removed
        ok = len(cleaned) <= 2  # might strip both orphans
        _result = "OK" if ok else f"FAIL: cleaned={len(cleaned)} msgs"
    expected: "OK"

