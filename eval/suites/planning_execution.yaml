# Planning & Execution Suite (weight: 15%)
# Tests multi-step task completion, planning state machine, and workflow.
dimension: "4. Planning & Execution"
weight: 0.15

tasks:
  - id: plan_state_transitions
    name: "planning state machine complete cycle"
    judge: python
    args:
      code: |
        from planning import (get_state, enter_plan_mode, submit_plan,
                              approve_plan, reject_plan, exit_plan_mode,
                              is_tool_allowed)

        # IDLE -> PLANNING
        enter_plan_mode("build feature X")
        assert get_state() == "planning"

        # In planning: write tools blocked
        assert not is_tool_allowed("bash")
        assert not is_tool_allowed("write_file")
        assert is_tool_allowed("read_file")
        assert is_tool_allowed("grep")

        # Submit plan
        submit_plan("Step 1: read\nStep 2: write", [])
        assert get_state() == "plan_ready"

        # Approve
        approve_plan()
        assert get_state() == "plan_approved"

        # Cleanup
        exit_plan_mode("test done")
        assert get_state() == "idle"

        _result = "OK"
    expected: "OK"

  - id: plan_readonly_enforcement
    name: "planning mode enforces read-only"
    judge: python
    args:
      code: |
        from planning import enter_plan_mode, is_tool_allowed, exit_plan_mode
        enter_plan_mode("test")
        read_ok = all(is_tool_allowed(t) for t in ["read_file", "grep", "glob", "web_search"])
        write_blocked = all(not is_tool_allowed(t) for t in ["bash", "write_file", "edit_file", "task"])
        exit_plan_mode("done")
        _result = "OK" if (read_ok and write_blocked) else f"read={read_ok} write={write_blocked}"
    expected: "OK"

  - id: plan_workflow_dag
    name: "workflow DAG engine basic flow"
    judge: python
    args:
      code: |
        from workflow import begin_workflow, add_workflow_node, seal_workflow

        wf_id = begin_workflow("test-wf", "test workflow")
        assert wf_id, "workflow ID should not be empty"
        add_workflow_node(wf_id, "step1", "do first thing", [])
        add_workflow_node(wf_id, "step2", "do second thing", ["step1"])
        seal_workflow(wf_id)

        # Verify it's sealed
        from workflow import _workflows
        wf = _workflows.get(wf_id)
        _result = "OK" if wf and wf.state in ("sealed", "running") else f"FAIL: state={wf.state if wf else 'not found'}"
    expected: "OK"

  - id: plan_task_board_crud
    name: "task board create/list/claim/complete"
    judge: python
    args:
      code: |
        from task import create_task, list_tasks, claim_task, complete_task

        tid = create_task("bench test", "test task for benchmark")
        tasks = list_tasks()
        ok1 = any(t.id == tid for t in tasks)

        claim_task(tid, "bench-agent")
        t = list_tasks()
        ok2 = any(t.status == "in_progress" for t in t if t.id == tid)

        complete_task(tid)
        t = list_tasks()
        ok3 = any(t.status == "completed" for t in t if t.id == tid)

        _result = "OK" if (ok1 and ok2 and ok3) else f"FAIL: {ok1}/{ok2}/{ok3}"
    expected: "OK"

  - id: plan_cron_validation
    name: "cron expression validation works"
    judge: python
    args:
      code: |
        from CronScheduler import validate_cron
        ok1 = validate_cron("*/5 * * * *")    # every 5 min
        ok2 = validate_cron("0 9 * * 1-5")    # weekdays 9am
        bad = not validate_cron("invalid cron")
        _result = "OK" if (ok1 and ok2 and bad) else f"FAIL: {ok1}/{ok2}/{bad}"
    expected: "OK"

  - id: plan_message_bus
    name: "inter-agent message passing works"
    judge: python
    args:
      code: |
        from MessageBus import BUS
        BUS.send("test-sender", "test-receiver", "hello benchmark", "text")
        inbox = BUS.read_inbox("test-receiver")
        _result = "OK" if inbox and len(inbox) > 0 else f"FAIL: empty inbox"
    expected: "OK"

  - id: plan_session_persistence
    name: "session save and load roundtrip"
    judge: python
    args:
      code: |
        from session import save_session, load_session, delete_session
        test_messages = [{"role": "user", "content": "test"}, {"role": "assistant", "content": "response"}]
        test_context = {"memories": "test"}
        save_session(test_messages, test_context, ".", "bench_test_session", "benchmark")
        loaded_msgs, loaded_ctx = load_session(".", "bench_test_session")
        ok = len(loaded_msgs) == 2 and loaded_ctx.get("memories") == "test"
        delete_session(".", "bench_test_session")
        _result = "OK" if ok else f"FAIL: msgs={len(loaded_msgs)} ctx={loaded_ctx}"
    expected: "OK"
